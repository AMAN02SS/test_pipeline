name: Cloud DevOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-ci:
    name: Terraform Quality & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Check Terraform Format
        run: terraform fmt -check -recursive

      - name: Initialize Dev Environment
        working-directory: terraform/environment/dev
        run: terraform init -backend=false

      - name: Validate Dev Environment
        working-directory: terraform/environment/dev
        run: terraform validate

      - name: Initialize Prod Environment
        working-directory: terraform/environment/prod
        run: terraform init -backend=false

      - name: Validate Prod Environment
        working-directory: terraform/environment/prod
        run: terraform validate