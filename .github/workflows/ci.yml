name: Terraform Azure Cloud Multi-Env Pipeline

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/**'
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Terraform Action'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  TF_VERSION: '1.8.0'
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  TF_VAR_admin_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

jobs:
  # ==========================================
  # STAGE 1: Code Quality & Syntax Validation
  # ==========================================
  validate:
    name: '1. Code Quality & Format Check'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Validate Dev Code
        working-directory: terraform/environment/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Prod Code
        working-directory: terraform/environment/prod
        run: |
          terraform init -backend=false
          terraform validate

  # ==========================================
  # STAGE 2: Security & Vulnerability Scan
  # ==========================================
  security-scan:
    name: '2. Security & Compliance Scan'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy IaC Security Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # DEV ENVIRONMENT JOBS
  # ==========================================
  dev-plan:
    name: 'Dev: Plan'
    needs: [validate, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (Dev)
        working-directory: terraform/environment/dev
        run: terraform init

      - name: Terraform Plan (Dev)
        working-directory: terraform/environment/dev
        run: terraform plan -no-color

  dev-apply:
    name: 'Dev: Apply'
    needs: [validate, security-scan]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (Dev)
        working-directory: terraform/environment/dev
        run: terraform init

      - name: Terraform Plan (Dev)
        working-directory: terraform/environment/dev
        run: terraform plan -out=tfplan-dev -no-color

      - name: Terraform Apply (Dev)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        working-directory: terraform/environment/dev
        run: terraform apply -auto-approve tfplan-dev

  # ==========================================
  # PROD ENVIRONMENT JOBS
  # ==========================================
  prod-plan:
    name: 'Prod: Plan'
    needs: dev-apply # Enforces that Dev successfully deploys before Prod starts
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (Prod)
        working-directory: terraform/environment/prod
        run: terraform init

      - name: Terraform Plan (Prod)
        working-directory: terraform/environment/prod
        run: terraform plan -out=tfplan-prod -no-color

      - name: Upload Prod Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-tfplan
          path: terraform/environment/prod/tfplan-prod
          retention-days: 1
          overwrite: true

  prod-apply:
    name: 'Prod: Apply'
    needs: prod-plan
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' && github.event.inputs.action == 'apply')
    environment: production # Triggers manual approval gate in GitHub Settings
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download Prod Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: prod-tfplan
          path: terraform/environment/prod

      - name: Terraform Init (Prod)
        working-directory: terraform/environment/prod
        run: terraform init

      - name: Terraform Apply (Prod)
        working-directory: terraform/environment/prod
        run: terraform apply -auto-approve tfplan-prod